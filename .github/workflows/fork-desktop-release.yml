name: Fork Desktop Release

# Sync the fork's master against the upstream repository, then package the
# unsigned mac and windows desktop applications and publish them to a rolling
# `desktop-nightly` prerelease on this fork. Linux packaging stays out of the
# matrix until the runtime CLI preparation completes a linux path.
#
# Rolling prereleases never touch the Homebrew tap: the tap tracks stable
# `dsh-v<VERSION>-no-telemetry` releases published by fork-versioned-release.yml.

on:
  schedule:
    # Daily catch-up for upstream changes; skipped entirely when the merge is empty.
    - cron: '0 5 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  # The sync job pushes upstream merges that routinely touch workflow files;
  # without this, GitHub rejects the push and every scheduled run fails.
  workflows: write

concurrency:
  group: fork-desktop-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  # Upstream CI marks telemetry-disabled runs the same way; keep the bundled
  # runtime smoke steps quiet regardless of which composition they boot.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  sync:
    name: Sync master against upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      head: ${{ steps.merge.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure a generic git identity for the automated merge
        run: |
          git config user.name 'desktop-release-bot'
          git config user.email 'desktop-release-bot@localhost'
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --no-tags upstream master
      - name: Merge upstream master
        id: merge
        run: |
          merged=false
          if git merge --no-edit upstream/master; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
              echo 'Upstream already merged: no new commit.'
            else
              merged=true
            fi
          else
            git merge --abort
            echo '::error::Upstream merge conflicts with the fork changes. Re-run locally, resolve, commit, and push.'
            exit 1
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push the synced master
        if: ${{ steps.merge.outputs.merged == 'true' }}
        run: |
          git push origin "master:master" && echo '::notice::Synced the fork master.' || { echo '::error::Push rejected; re-run once the remote state is reconciled.'; exit 1; }

  package:
    name: Package ${{ matrix.target }}
    needs: sync
    # A scheduled run with an empty merge has nothing new to build; push and
    # manual runs always carry their own change.
    if: ${{ needs.sync.outputs.merged == 'true' || github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-14
            script: package:mac:arm64:unsigned
            workspace-root: .
            asset-path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
            asset-filter: dmg
          - target: mac-x64
            os: macos-14
            script: package:mac:x64:unsigned
            workspace-root: .
            asset-path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
            asset-filter: dmg
          - target: win-x64
            os: windows-latest
            script: package:win:x64:unsigned
            # The fork's name pushes packaged paths past the Windows 260-character
            # limit that the bundled LibreOffice kit enforces (its launcher never
            # opts into long paths); a short repository root keeps every kit file
            # below it. See libreoffice-kit's cppuhelper bootstrap directory open.
            workspace-root: D:\dshrepo
            asset-path: D:/dshrepo/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            asset-filter: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.head }}
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Relocate the repository to a short Windows path
        if: ${{ matrix.workspace-root != '.' }}
        shell: bash
        run: |
          shopt -s dotglob
          mkdir -p /d/dshrepo
          mv "$GITHUB_WORKSPACE"/* /d/dshrepo/
      - name: Enable Rosetta for the x64 target runtime
        if: ${{ matrix.target == 'mac-x64' }}
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - name: Write the local unsigned packaging settings
        working-directory: ${{ matrix.workspace-root }}
        shell: bash
        run: |
          cd apps/desktop
          release_id=$(openssl rand -hex 16)
          settings='DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://updates.invalid
          DOWNLOAD_TEST_RELEASE_ID='"$release_id"'
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://updates.invalid"]}'
          printf '%s\n' "$settings" > .env.macos
          printf '%s\n' "$settings" 'DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3' > .env.windows
      - name: Configure the pnpm store cache
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          # hashFiles() reads the original workspace root, which the Windows leg
          # relocates to a short path; hash the relocated lockfile instead.
          lock="${{ matrix.workspace-root }}/pnpm-lock.yaml"
          echo "key=$(shasum -a 256 "$lock" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ steps.pnpm-store.outputs.key }}
      - name: Install
        working-directory: ${{ matrix.workspace-root }}
        run: pnpm install --frozen-lockfile
      - name: Build artifacts
        working-directory: ${{ matrix.workspace-root }}
        run: pnpm run build:artifacts
      - name: Package
        working-directory: ${{ matrix.workspace-root }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.script }}
      - name: Inspect the packaged LibreOffice kit trees
        if: ${{ always() && matrix.target == 'win-x64' }}
        working-directory: ${{ matrix.workspace-root }}
        shell: bash
        run: |
          set -u
          staging_tre="apps/desktop/.desktop-build/targets/win-x64/dsh/node_modules/@deepseek-ai/libreoffice-kit-win32-x64"
          unpacked_tre="apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources/app.asar.unpacked/dsh/node_modules/@deepseek-ai/libreoffice-kit-win32-x64"
          echo "staging files: $(find "$staging_tre" 2>/dev/null | wc -l)  unpacked files: $(find "$unpacked_tre" 2>/dev/null | wc -l)"
          for f in prebuilds.json bin/libreoffice-kit.exe program/program/services "program/program/services/services.rdb" program/program/types/offapi.rdb "program/share/config/wizard/form/styles/beige.css"; do
            s=missing; u=missing
            [ -e "$staging_tre/$f" ] && s=present
            [ -e "$unpacked_tre/$f" ] && u=present
            echo "$f -> staging:$s unpacked:$u"
          done
          diff <(cd "$staging_tre" && find . | sort) <(cd "$unpacked_tre" && find . | sort) > /tmp/kit-diff.txt || true
          echo 'Difference (staging vs unpacked), first 30 lines:'
          head -30 /tmp/kit-diff.txt
          echo 'longest unpacked kit path:'
          cd "$unpacked_tre" && find . | sed 's|^|D:/dshrepo/|' | awk '{ n = length($0) } n > m { m = n; line = $0 } END { print m, line }'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: ${{ matrix.asset-path }}

  release:
    name: Publish the rolling prerelease
    needs: [sync, package]
    # Quiet schedule days build nothing, so there is nothing to publish;
    # push and manual runs always carry their own change.
    if: ${{ !cancelled() && (needs.sync.outputs.merged == 'true' || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.head }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Publish a per-date prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date_tag="desktop-$(date -u +%F)"
          product_version=$(jq -r .version apps/desktop/package.json)
          gh release delete "desktop-nightly" --cleanup-tag --yes 2>/dev/null || true
          gh release delete "$date_tag" --cleanup-tag --yes 2>/dev/null || true
          if [ ! -e release-assets ] || [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo '::error::No desktop artifacts were produced by any packaging leg.'
            exit 1
          fi
          head=$(git rev-parse --short HEAD)
          gh release create "$date_tag" release-assets/* \
            --prerelease --latest=false \
            --title "Desktop build @ $head" \
            --notes "Unsigned desktop snapshot from commit $head. No notarization: clear the quarantine flag on macOS before first launch when downloading outside brew."
          ls -1 release-assets/deepseek-harness-*.dmg 2>/dev/null | head -1 | grep . >/dev/null || {
            echo '::notice::No mac DMG artifacts were produced by any packaging leg.'
            exit 0
          }
